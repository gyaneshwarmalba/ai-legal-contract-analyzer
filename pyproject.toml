[project]
name = "ai-legal-contract-analyzer"
version = "1.0.0"
description = "Governed RAG pipeline for legal contract analysis with human-in-the-loop review"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI dependency injection uses Depends() in defaults
